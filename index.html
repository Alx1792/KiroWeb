<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#050816">
  <title>Bey Battle Ultimate 3D — Metal Fury × Burst Evolution</title>
  <meta name="description" content="Batalles de baldufes 3D amb tornejos Metal Fury i Burst Evolution, PvP local i entrenament.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Oxanium:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script type="importmap">
    {
      "imports": {
        "three": "./vendor/three.module.js",
        "three/addons/": "./vendor/addons/"
      }
    }
  </script>
</head>
<body>
  <main id="app" class="app-shell">
    <h1 class="sr-only">Bey Battle Ultimate 3D</h1>
    <div id="viewport" class="viewport">
      <canvas id="game" tabindex="0" aria-label="Joc 3D de batalla de baldufes"></canvas>
      <div id="loading" class="loading-screen" aria-live="polite">
        <p class="eyebrow">Inicialitzant motor 3D</p>
        <strong>BEY BATTLE ULTIMATE</strong>
        <div class="loading-track"><i id="loadingBar"></i></div>
        <span id="loadingText">Preparant Three.js…</span>
      </div>
      <div class="vignette" aria-hidden="true"></div>
      <div id="hud" class="hud hidden" aria-live="polite"></div>
      <div id="screen" class="screen" aria-live="polite"></div>
      <div id="toast" class="toast" aria-live="assertive"></div>
      <button id="fullscreen" class="icon-button" type="button" aria-label="Pantalla completa">⛶</button>
    </div>
    <section class="quick-help" aria-label="Controls principals">
      <span><b>J1</b> WASD · ESPAI</span><span><b>J2</b> FLETXES · ENTER</span>
      <span><b>PAUSA</b> ESC / P</span><span><b>MÚSICA</b> M</span>
    </section>
  </main>
  <noscript>Cal activar JavaScript per jugar.</noscript>
  <script type="module" src="js/main.js"></script>
</body>
</html>
